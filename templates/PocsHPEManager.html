<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPE Data Management - Proof of Concept Historial</title>
    <link rel="stylesheet" href="/static/css/PocsHPEManager.css">
    <link rel="stylesheet" href="/static/css/navbar_hpe.css">

    <style>
                .table-container {
            border: 1px solid var(--border-gray, #e5e7e6);
            border-radius: 0.75rem;
            background-color: white;
            margin-top: 1.5rem;
        }

                .table-header {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border-bottom: 2px solid var(--border-gray, #e5e7e6);
        }

        .table-header thead th {
            padding: 1rem;
            font-weight: 600;
            text-align: left;
            background-color: white;
        }

                .table-wrapper {
            max-height: 65vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .table-wrapper tbody td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-gray, #e5e7e6);
        }

                .table-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>


    <main>
        <div class="page-header">
            <h2 class="page-title">Proof of Concept Historial</h2>
            
            <div class="controls">
                <div class="search-box">
                    <div class="search-icon">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M19.5306 18.4694L14.8366 13.7762C17.6629 10.383 17.3204 5.36693 14.0591 2.38935C10.7978 -0.588237 5.77134 -0.474001 2.64867 2.64867C-0.474001 5.77134 -0.588237 10.7978 2.38935 14.0591C5.36693 17.3204 10.383 17.6629 13.7762 14.8366L18.4694 19.5306C18.7624 19.8237 19.2376 19.8237 19.5306 19.5306C19.8237 19.2376 19.8237 18.7624 19.5306 18.4694ZM1.75 8.5C1.75 4.77208 4.77208 1.75 8.5 1.75C12.2279 1.75 15.25 4.77208 15.25 8.5C15.25 12.2279 12.2279 15.25 8.5 15.25C4.77379 15.2459 1.75413 12.2262 1.75 8.5Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <input type="text" class="search-input" placeholder="Search">
                </div>
                
                <button class="filter-btn" title="Filter POCs">
                    <svg width="20" height="19" viewBox="0 0 20 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M19.6187 1.64344C19.3828 1.09823 18.8441 0.746593 18.25 0.75H1.75C1.15687 0.751169 0.620137 1.10173 0.380657 1.64436C0.141177 2.18699 0.243933 2.81978 0.642812 3.25875L0.650312 3.26719L7 10.0472V17.25C6.99987 17.8032 7.30418 18.3115 7.7918 18.5726C8.27942 18.8338 8.87119 18.8054 9.33156 18.4988L12.3316 16.4981C12.7492 16.2199 13.0001 15.7512 13 15.2494V10.0472L19.3506 3.26719L19.3581 3.25875C19.7615 2.8215 19.8641 2.18536 19.6187 1.64344ZM11.9069 9.02625C11.6463 9.30242 11.5008 9.66751 11.5 10.0472V15.2494L8.5 17.25V10.0472C8.50087 9.66615 8.35597 9.2992 8.095 9.02156L1.75 2.25H18.25L11.9069 9.02625Z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="table-container">
                        <table class="table-header">
                <colgroup>
                    <col style="width: 18%;">
                    <col style="width: 18%;">
                    <col style="width: 34%;">
                    <col style="width: 15%;">
                    <col style="width: 15%;">
                </colgroup>
                <thead>
                    <tr>
                        <th>Requestor Name</th>
                        <th>Client</th>
                        <th>Business Justification</th>
                        <th>Status</th>
                        <th>Details</th>
                    </tr>
                </thead>
            </table>
            
                        <div class="table-wrapper">
                <table>
                    <colgroup>
                        <col style="width: 18%;">
                        <col style="width: 18%;">
                        <col style="width: 34%;">
                        <col style="width: 15%;">
                        <col style="width: 15%;">
                    </colgroup>
                    <tbody>
                                                <tr>
                            <td colspan="5" style="text-align: center; padding: 2rem; color: var(--muted-text);">
                                Cargando POCs...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <script>
  // Mostrar navbar solo si el role en localStorage es HPE_REP o HPE_MANAGER
  const role = localStorage.getItem('role');
  if (role === 'HPE_REP' || role === 'HPE_MANAGER') {
      fetch('/components/navbar_hpe.html')
        .then(r => r.text())
        .then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
        })
        .catch(err => console.error('Error cargando navbar_hpe:', err));
  }
</script>
    <script src="/static/js/navbar_client.js"></script>
    <script src="/static/js/role_hpe.js"></script>
    <script src="/static/js/PocsHPEManager.js"></script>
</body>
</html>
