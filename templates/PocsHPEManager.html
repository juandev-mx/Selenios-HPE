<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPE Data Management - Proof of Concept Historial</title>
    <link rel="stylesheet" href="/static/css/PocsHPEManager.css">
    <style>
        /* Estilos adicionales para el scroll del contenedor */
        .table-container {
            border: 1px solid var(--border-gray, #e5e7e6);
            border-radius: 0.75rem;
            background-color: white;
            margin-top: 1.5rem;
        }

        /* Tabla del header (sin scroll) */
        .table-header {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border-bottom: 2px solid var(--border-gray, #e5e7e6);
        }

        .table-header thead th {
            padding: 1rem;
            font-weight: 600;
            text-align: left;
            background-color: white;
        }

        /* Contenedor con scroll para el tbody */
        .table-wrapper {
            max-height: 65vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .table-wrapper tbody td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-gray, #e5e7e6);
        }

        /* Scrollbar personalizada */
        .table-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

                <h1 class="header-title">Data Management</h1>
            </div>
            
            <div class="header-right">
<nav>
