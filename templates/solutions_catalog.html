<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Solutions Catalog - HPE</title>
  <link rel="stylesheet" href="/static/css/SolutionsClientes.css">
  <link rel="stylesheet" href="/static/css/navbar_cliente.css">
  <link rel="stylesheet" href="/static/css/navbar_hpe.css">
</head>

<body>
  <div id="navbar-placeholder"></div>

  <main class="main-container">
    <section class="solutions-section">
      <div class="section-header">
        <h1 class="section-title">Solutions catalog</h1>
        <div class="controls">
          <div class="search-box">
            <div class="search-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M19.5306 18.4694L14.8366 13.7762C17.6629 10.383 17.3204 5.36693 14.0591 2.38935C10.7978 -0.588237 5.77134 -0.474001 2.64867 2.64867C-0.474001 5.77134 -0.588237 10.7978 2.38935 14.0591C5.36693 17.3204 10.383 17.6629 13.7762 14.8366L18.4694 19.5306C18.7624 19.8237 19.2376 19.8237 19.5306 19.5306C19.8237 19.2376 19.8237 18.7624 19.5306 18.4694ZM1.75 8.5C1.75 4.77208 4.77208 1.75 8.5 1.75C12.2279 1.75 15.25 4.77208 15.25 8.5C15.25 12.2279 12.2279 15.25 8.5 15.25C4.77379 15.2459 1.75413 12.2262 1.75 8.5Z" fill="#479E85"/>
              </svg>
            </div>
            <input type="text" class="search-input" placeholder="Search">
          </div>
        </div>
      </div>
      
      <p class="section-subtitle">This is a read-only view of the available equipment and equipment items. You cannot edit the inventory from this screen.</p>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Product Number</th>
              <th>Description</th>
              <th>Owner</th>
              <th>Items</th>
              <th>Price</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="6" style="text-align:center;">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="items-section">
      <div class="section-header">
        <h2 class="section-title">Items</h2>
        <div class="controls">
          <div class="search-box">
            <div class="search-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M19.5306 18.4694L14.8366 13.7762C17.6629 10.383 17.3204 5.36693 14.0591 2.38935C10.7978 -0.588237 5.77134 -0.474001 2.64867 2.64867C-0.474001 5.77134 -0.588237 10.7978 2.38935 14.0591C5.36693 17.3204 10.383 17.6629 13.7762 14.8366L18.4694 19.5306C18.7624 19.8237 19.2376 19.8237 19.5306 19.5306C19.8237 19.2376 19.8237 18.7624 19.5306 18.4694ZM1.75 8.5C1.75 4.77208 4.77208 1.75 8.5 1.75C12.2279 1.75 15.25 4.77208 15.25 8.5C15.25 12.2279 12.2279 15.25 8.5 15.25C4.77379 15.2459 1.75413 12.2262 1.75 8.5Z" fill="#479E85"/>
              </svg>
            </div>
            <input type="text" class="search-input" placeholder="Search">
          </div>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Product Number</th>
              <th>Product Name</th>
              <th>Unit Price</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="3" style="text-align:center;">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Cargar navbar según el role
    const role = localStorage.getItem('role');
    
    if (role === 'CLIENT') {
    fetch('/components/navbar_cliente.html')
      .then(r => r.text())
      .then(html => {
          document.getElementById('navbar-placeholder').innerHTML = html;

          console.log("🔧 Ejecutando initNavbarCliente DESPUÉS del fetch");

          // 2️⃣ Aquí se ejecuta initNavbarHPE cuando el HTML YA existe
          if (typeof initNavbarHPE === 'function') {
              initNavbarHPE();
          }
      })
      .catch(err => console.error('Error cargando navbar_hpe:', err));
  }else if (role === 'HPE_REP' || role === 'HPE_MANAGER') {
    fetch('/components/navbar_hpe.html')
      .then(r => r.text())
      .then(html => {
          document.getElementById('navbar-placeholder').innerHTML = html;

          console.log("🔧 Ejecutando initNavbarHPE DESPUÉS del fetch");

          // 2️⃣ Aquí se ejecuta initNavbarHPE cuando el HTML YA existe
          if (typeof initNavbarHPE === 'function') {
              initNavbarHPE();
          }
      })
      .catch(err => console.error('Error cargando navbar_hpe:', err));
  }
  </script>

  <!-- Cargar el JS del navbar correspondiente -->
  <script src="/static/js/navbar_hpe.js"></script>
  <script src="/static/js/navbar_client.js"></script>
  
  <!-- Script principal de la página -->
  <script src="/static/js/solutions_catalog.js"></script>
</body>
</html>
