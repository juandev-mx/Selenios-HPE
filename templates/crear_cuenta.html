<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registration - HPE</title>
  <meta name="description" content="Registro de cuenta HPE" />
  <link rel="stylesheet" href="/static/css/login_registro.css">
</head>

<body>
  <header class="site-header">
    <img class="logo"
      src="https://api.builder.io/api/v1/image/assets/TEMP/b6c8dab6f63654e67b12b91334f7ee63a00156b1?width=766"
      alt="Hewlett Packard Enterprise">
  </header>

<main class="page-main">
  <div class="card" role="region" aria-labelledby="cardTitle">
    <h1 id="cardTitle" class="card-title title-normal">Create an account</h1>
    <form id="registerForm" class="login-form" novalidate>

      <div class="field">
        <label for="fullName" class="field-label">Full name</label>
        <input id="fullName" name="fullName" type="text" placeholder="Enter your full name" class="input"
          aria-describedby="nameError" required>
        <div id="nameError" class="error" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="email" class="field-label">Email</label>
        <input id="email" name="email" type="email" placeholder="Enter your email address" class="input"
          aria-describedby="emailError" required>
        <div id="emailError" class="error" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="password" class="field-label">Password</label>
        <input id="password" name="password" type="password" placeholder="Create a password" class="input"
          aria-describedby="passwordError" required minlength="6">
        <div id="passwordError" class="error" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="confirmPassword" class="field-label">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm your password" class="input"
          aria-describedby="confirmPasswordError" required minlength="6">
        <div id="confirmPasswordError" class="error" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="company" class="field-label">Company name</label>
        <input id="company" name="company" type="text" placeholder="Enter your company name" class="input"
          aria-describedby="companyError" required>
        <div id="companyError" class="error" aria-live="polite"></div>
      </div>

      <button id="submitBtn" type="submit" class="btn">Create account</button>
    </form>

    <p class="forgot-password"><a href="/login.html">Do you already have an account? Log in</a></p>
  </div>
</main>
    <script src="/static/js/notifications.js"></script>
    <script src="/static/js/registro.js"></script>
</body>

</html>
