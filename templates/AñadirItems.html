<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add New Item</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/AñadirItems.css">
</head>
<body>
  <main class="overlay">
    <div class="modal-card">
      <!-- Header -->
      <header class="modal-header">
        <h1 class="modal-title">Add New Item</h1>
        <p class="modal-subtitle">Fill in the details below to add a new item to a solution.</p>
      </header>

      <!-- Form -->
      <form class="item-form" aria-label="Add new item form">
        <div class="form-grid">
          <!-- Product Number -->
          <div class="field">
            <label class="field-label" for="product-number">Product Number</label>
            <input 
              id="product-number" 
              class="field-input" 
              type="text" 
              placeholder="e.g., P12345-B21"
            />
          </div>

          <!-- Product Name -->
          <div class="field">
            <label class="field-label" for="product-name">Product Name</label>
            <input 
              id="product-name" 
              class="field-input" 
              type="text" 
              placeholder="e.g., HPE ProLiant DL380"
            />
          </div>

          <!-- Quantity -->
          <div class="field">
            <label class="field-label" for="quantity">Quantity</label>
            <input 
              id="quantity" 
              class="field-input" 
              type="number" 
              placeholder="0"
              value="0"
            />
          </div>

          <!-- Unit Price -->
          <div class="field">
            <label class="field-label" for="unit-price">Unit Price ($)</label>
            <input 
              id="unit-price" 
              class="field-input" 
              type="number" 
              step="0.01"
              placeholder="0.00"
              value="0.00"
            />
          </div>
        </div>

        <!-- Footer Actions -->
        <footer class="modal-footer">
          <button type="button" class="btn-text">Cancel</button>
          <button type="submit" class="btn-primary">Save Item</button>
        </footer>
      </form>
    </div>
  </main>
</body>
</html>
