<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - HPE</title>
  <meta name="description" content="Login page from Figma design" />
  <link rel="stylesheet" href="/static/css/login_registro.css">
</head>

<body>
  <header class="site-header">
    <img class="logo"
      src="https://api.builder.io/api/v1/image/assets/TEMP/b6c8dab6f63654e67b12b91334f7ee63a00156b1?width=766"
      alt="Hewlett Packard Enterprise">
  </header>

  <main class="page-main">
    <div class="card" role="region" aria-labelledby="cardTitle">
      <h1 id="cardTitle" class="card-title">Iniciar sesión en HPE</h1>
      <form id="loginForm" class="login-form" novalidate>
        <div class="field">
          <label for="email" class="field-label">Correo electrónico</label>
          <input id="email" name="email" type="email" placeholder="Correo electrónico" class="input"
            aria-describedby="emailError" required>
          <div id="emailError" class="error" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="password" class="field-label">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="Contraseña" class="input"
            aria-describedby="passwordError" required minlength="6">
          <div id="passwordError" class="error" aria-live="polite"></div>
        </div>

        <button id="submitBtn" type="submit" class="btn">Iniciar sesión</button>
      </form>

      <p class="forgot-password"><a href="#">¿Olvidaste tu contraseña?</a></p>
      <hr class="divider">
      <a href="crear_cuenta.html" class="btn_registro">Crear cuenta nueva</a>
    </div>
  </main>


  <!-- Agregar el script -->
  <script src="/static/js/login.js"></script>
</body>

</html>
