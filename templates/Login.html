<!doctype html>
<html lang="es">
    <style>
        /* styles.css - Pixel-accurate responsive CSS for the provided Figma login */
:root{
  --bg: 0 0% 100%;            /* used as hsl(var(--bg)) if needed */
  --foreground: 222.2 84% 4.9%;
  --input-bg: #F0F5F2;        /* light green input bg from design */
  --input-fore: #5E8C7D;      /* placeholder / muted text color */
  --cta: #05AD7A;             /* button green */
  --shadow: 0 4px 4px rgba(0,0,0,0.25);
  --radius: 8px;
  --max-form-width: 480px;
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  box-sizing: border-box;
}

*, *::before, *::after { box-sizing: inherit; }

html,body {
  height: 100%;
  margin: 0;
  background: hsl(var(--bg));
  color: hsl(var(--foreground));
}

.container{
  width: min(1200px, 92%);
  margin: 0 auto;
}

/* Header style matching Figma: left-aligned logo, subtle bottom border and shadow */
.site-header{
  border-bottom: 1px solid #000;
  box-shadow: var(--shadow);
  background: #fff;
}
.site-header .container{
  display:flex;
  align-items:center;
  padding: 16px 0;
}
.brand{
  height: 56px;
  width: auto;
  display:block;
}

/* Main layout - center column, responsive spacing */
.main{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  min-height: calc(100vh - 88px);
  padding: 48px 0;
}

/* Form wrapper to mirror Figma placement and scale */
.form-wrap{
  max-width: var(--max-form-width);
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap: 20px;
}

/* Title */
.title{
  font-size: 28px;
  line-height: 1.25;
  font-weight: 700;
  margin: 0 0 6px;
  text-align:center;
  color: #121717;
}

/* Form */
.login-form{
  width:100%;
  display:flex;
  flex-direction:column;
  gap: 16px;
  align-items:stretch;
}

/* Inputs */
.input{
  width:100%;
  background: var(--input-bg);
  color: var(--input-fore);
  border: none;
  padding: 16px;
  border-radius: var(--radius);
  font-size: 16px;
  line-height: 1.4;
  outline: none;
  box-shadow: none;
  transition: box-shadow 160ms ease, transform 160ms ease;
}

/* placeholder color */
.input::placeholder{
  color: var(--input-fore);
  opacity: 1;
}

/* Focus style */
.input:focus{
  box-shadow: 0 0 0 4px rgba(5,173,122,0.08);
}

/* Button */
.btn-primary{
  display:inline-block;
  width:100%;
  background: var(--cta);
  color: #fff;
  border: none;
  padding: 12px 18px;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 14px;
  line-height: 1.5;
  cursor: pointer;
  transition: transform 120ms ease, filter 120ms ease;
}
.btn-primary:hover{ filter:brightness(.95); transform:translateY(-1px); }
.btn-primary:active{ transform:translateY(0); }

/* Muted note under the form */
.muted-note{
  margin: 8px 0 0;
  font-size: 14px;
  color: var(--input-fore);
  text-align:center;
}

/* Utility: visually hidden label for accessibility */
.sr-only{
  position:absolute!important;
  width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* Responsive tweaks */
@media (min-width: 768px){
  .brand{ height: 72px; }
  .main{ padding: 72px 0; }
  .title{ font-size: 32px; }
  :root { --max-form-width: 480px; }
}
@media (min-width: 1100px){
  .site-header .container{ padding-left: 160px; padding-right: 160px; }
  .main{ padding-left: 160px; padding-right: 160px; min-height: calc(100vh - 96px); }
}
    </style>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Hewlett Packard Enterprise</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <img class="brand" src="https://api.builder.io/api/v1/image/assets/TEMP/b99554e9b7fb5ac2c138e054653fea829a7b0bae?width=438" alt="Hewlett Packard Enterprise">
    </div>
  </header>

  <main class="main">
    <div class="container form-wrap" aria-labelledby="welcome-title">
      <h1 id="welcome-title" class="title">ME GUSTA DANCA!</h1>

      <form class="login-form" action="#" method="post" onsubmit="event.preventDefault();">
        <label class="sr-only" for="username">Nombre de usuarioooo</label>
        <input id="username" name="username" type="text" placeholder="Nombre de usuario" autocomplete="username" class="input"/>

        <label class="sr-only" for="password">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="Contraseña" autocomplete="current-password" class="input"/>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <p class="muted-note">No tienes una cuenta? Inicia sesión</p>
    </div>
  </main>
</body>
</html>
