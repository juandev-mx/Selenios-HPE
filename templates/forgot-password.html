<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HPE</title>
    <style>
        :root {
            --hpe-blue: #00B388;
            --hpe-dark-blue: #009F78;
            --hpe-light-gray: #f5f7fa;
            --hpe-gray: #6c757d;
            --hpe-dark-gray: #343a40;
            --hpe-white: #ffffff;
            --hpe-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--hpe-light-gray) 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background-color: var(--hpe-white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--hpe-shadow);
        }
        
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, var(--hpe-blue) 0%, var(--hpe-dark-blue) 100%);
            color: var(--hpe-white);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .left-panel h2 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .left-panel p {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .graphic-container {
            margin: 30px 0;
            width: 200px;
            height: 200px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .graphic {
            width: 120px;
            height: 120px;
            background-color: var(--hpe-white);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--hpe-blue);
            font-size: 48px;
        }
        
        .right-panel {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .logo {
            height: 40px;
            margin-right: 15px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--hpe-dark-gray);
        }
        
        .form-header {
            margin-bottom: 30px;
        }
        
        .form-header h1 {
            font-size: 28px;
            color: var(--hpe-dark-gray);
            margin-bottom: 10px;
        }
        
        .form-header p {
            color: var(--hpe-gray);
            line-height: 1.6;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--hpe-dark-gray);
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            border-color: var(--hpe-blue);
            box-shadow: 0 0 0 3px rgba(0, 179, 136, 0.2);
            outline: none;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--hpe-blue);
            color: var(--hpe-white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
        }
        
        .btn:hover {
            background-color: var(--hpe-dark-blue);
        }
        
        .btn:disabled {
            background-color: #a0a0a0;
            cursor: not-allowed;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 25px;
        }
        
        .login-footer a {
            color: var(--hpe-blue);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            transition: color 0.3s ease;
        }
        
        .login-footer a:hover {
            color: var(--hpe-dark-blue);
            text-decoration: underline;
        }
        
        /*.login-footer a::before {
            content: "←";
            margin-right: 8px;
            font-weight: bold;
        }*/
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .left-panel {
                padding: 30px 20px;
            }
            
            .right-panel {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h2>Recover Your Access</h2>
            <p>We'll help you reset your password securely and quickly.</p>
            <div class="graphic-container">
                <div class="graphic">
                    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                    </svg>
                </div>
            </div>
            <p>You'll receive a secure link in your email to create a new password.</p>
        </div>
        
        <div class="right-panel">
            <div class="logo-container">
                <img src="https://api.builder.io/api/v1/image/assets/TEMP/8f928b3a2de14b9d3a5110b2e76de58b31f5c89d?width=188" alt="HPE Logo" class="logo">
                <div class="logo-text">HPE</div>
            </div>
            
            <div class="form-header">
                <h1>Reset Password</h1>
                <p>Enter your email address and we'll send you a secure link to reset your password.</p>
            </div>
            
            <form id="forgotPasswordForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div id="message" class="message" style="display: none;"></div>

                <button type="submit" id="submitBtn" class="btn">Send Reset Link</button>
            </form>

            <div class="login-footer">
                <a href="/login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            // Basic email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                messageDiv.textContent = 'Please enter a valid email address.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ mail: email })
                });

                const data = await response.json();

                messageDiv.textContent = data.message;
                messageDiv.className = 'message success';
                messageDiv.style.display = 'block';

                // Clear form
                document.getElementById('email').value = '';

            } catch (error) {
                messageDiv.textContent = 'Connection error. Please try again.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
