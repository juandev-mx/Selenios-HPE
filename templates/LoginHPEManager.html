<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width,initial-scale=1" />
 <title>Login - HPE</title>
 <meta name="description" content="Login page from Figma design" />
 <link rel="stylesheet" href="/static/css/LoginHPEManager.css">
</head>

<body>
 <header class="site-header">
   <img class="logo" src="https://api.builder.io/api/v1/image/assets/TEMP/b6c8dab6f63654e67b12b91334f7ee63a00156b1?width=766" alt="Hewlett Packard Enterprise">
 </header>

 <main class="page-main">
   <div class="card" role="region" aria-labelledby="headingCard">
     <h1 id="headingCard" class="card-title">¡Welcome!</h1>

     <form id="authPanel" class="login-form" novalidate>
       <div class="field">
         <label for="userField" class="field-label">User</label>
         <input id="userField" name="userField" type="email" placeholder="Email" class="input" aria-describedby="userFieldError" required>
         <div id="userFieldError" class="error" aria-live="polite"></div>
       </div>

       <div class="field">
         <label for="secretField" class="field-label">Password</label>
         <input id="secretField" name="secretField" type="password" placeholder="Password" class="input" aria-describedby="secretFieldError" required minlength="6">
         <div id="secretFieldError" class="error" aria-live="polite"></div>
       </div>

       <button id="actionSubmit" type="submit" class="btn">Login</button>
     </form>
   </div>
 </main>
</body>
</html>
