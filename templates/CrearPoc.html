<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create New POC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/CrearPoc.css">
</head>

<body>
  <main class="page">
    <div class="shell">
      <h1 class="title">Create New POC</h1>

      <form class="card" aria-label="Create new POC">
        <!-- Business Justification -->
        <div class="section">
          <label class="label" for="justification">Business Justification</label>
          <textarea id="justification" class="textarea" placeholder="Enter business justification..." rows="6"></textarea>
        </div>

        <!-- Solutions Selection -->
        <div class="section">
          <h2 class="section-title">Solutions Selection</h2>

          <div class="grid">
            <div class="field">
              <label class="label" for="equipment">Equipment</label>
              <div class="search">
                <input id="equipment" class="input" type="text" placeholder="Search and select equipment" />
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 21L13.3 14.7C12.8 15.1 12.225 15.4167 11.575 15.65C10.925 15.8833 10.2333 16 9.5 16C7.68333 16 6.14583 15.3708 4.8875 14.1125C3.62917 12.8542 3 11.3167 3 9.5C3 7.68333 3.62917 6.14583 4.8875 4.8875C6.14583 3.62917 7.68333 3 9.5 3C11.3167 3 12.8542 3.62917 14.1125 4.8875C15.3708 6.14583 16 7.68333 16 9.5C16 10.2333 15.8833 10.925 15.65 11.575C15.4167 12.225 15.1 12.8 14.7 13.3L21 19.6L19.6 21ZM9.5 14C10.75 14 11.8125 13.5625 12.6875 12.6875C13.5625 11.8125 14 10.75 14 9.5C14 8.25 13.5625 7.1875 12.6875 6.3125C11.8125 5.4375 10.75 5 9.5 5C8.25 5 7.1875 5.4375 6.3125 6.3125C5.4375 7.1875 5 8.25 5 9.5C5 10.75 5.4375 11.8125 6.3125 12.6875C7.1875 13.5625 8.25 14 9.5 14Z" fill="currentColor"/></svg>
              </div>
            </div>

            <div class="field">
              <label class="label" for="items">Equipment Items</label>
              <div class="search">
                <input id="items" class="input" type="text" placeholder="Search and select items" />
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 21L13.3 14.7C12.8 15.1 12.225 15.4167 11.575 15.65C10.925 15.8833 10.2333 16 9.5 16C7.68333 16 6.14583 15.3708 4.8875 14.1125C3.62917 12.8542 3 11.3167 3 9.5C3 7.68333 3.62917 6.14583 4.8875 4.8875C6.14583 3.62917 7.68333 3 9.5 3C11.3167 3 12.8542 3.62917 14.1125 4.8875C15.3708 6.14583 16 7.68333 16 9.5C16 10.2333 15.8833 10.925 15.65 11.575C15.4167 12.225 15.1 12.8 14.7 13.3L21 19.6L19.6 21ZM9.5 14C10.75 14 11.8125 13.5625 12.6875 12.6875C13.5625 11.8125 14 10.75 14 9.5C14 8.25 13.5625 7.1875 12.6875 6.3125C11.8125 5.4375 10.75 5 9.5 5C8.25 5 7.1875 5.4375 6.3125 6.3125C5.4375 7.1875 5 8.25 5 9.5C5 10.75 5.4375 11.8125 6.3125 12.6875C7.1875 13.5625 8.25 14 9.5 14Z" fill="currentColor"/></svg>
              </div>
            </div>
          </div>

          <div class="actions-row">
            <button type="button" class="btn btn-ghost">Add to POC</button>
          </div>
        </div>

        <!-- Items table -->
        <div class="table-wrap">
          <table class="items-table" role="table" aria-label="Selected items">
            <thead>
              <tr>
                <th>Type</th>
                <th>Item Name</th>
                <th>Quantity</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Equipment</td>
                <td class="muted">Server Model X</td>
                <td class="muted">1</td>
                <td><button class="link">Remove</button></td>
              </tr>
              <tr>
                <td>Equipment Item</td>
                <td class="muted">RAM Module</td>
                <td class="muted">4</td>
                <td><button class="link">Remove</button></td>
              </tr>
              <tr>
                <td>Equipment</td>
                <td class="muted">Storage Array Y</td>
                <td class="muted">2</td>
                <td><button class="link">Remove</button></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="footer-actions">
          <button type="button" class="btn btn-primary">Create POC</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
