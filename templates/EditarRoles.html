<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edit User Role</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="EditarRoles.css">
</head>
<body>
  <main class="page-overlay">
    <div class="role-modal">
      <!-- Header -->
      <header class="modal-head">
        <h1 class="head-title">Edit User Role</h1>
        <p class="head-desc">Update role and reporting line for a user.</p>
      </header>

      <!-- Form -->
      <form class="role-form" aria-label="Edit user role form">
        <!-- User Field -->
        <div class="input-field">
          <label class="input-label" for="user">User</label>
          <input 
            id="user" 
            class="input-box" 
            type="text" 
            value="Jonh Doe"
            readonly
          />
        </div>

        <!-- Select New Role -->
        <div class="input-field">
          <label class="input-label" for="role">Select New Role</label>
          <div class="select-wrapper">
            <select id="role" class="select-box">
              <option value="hpe-rep">HPE Rep</option>
              <option value="admin">Admin</option>
              <option value="manager">Manager</option>
            </select>
            <svg class="select-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 15.4L6 9.4L7.4 8L12 12.6L16.6 8L18 9.4L12 15.4Z" fill="#1D1B20"/>
            </svg>
          </div>
        </div>

        <!-- Reports To -->
        <div class="input-field">
          <label class="input-label" for="reports-to">Reports To</label>
          <div class="select-wrapper">
            <select id="reports-to" class="select-box">
              <option value="alise">Alise Johnson</option>
              <option value="john">John Smith</option>
              <option value="sarah">Sarah Williams</option>
            </select>
            <svg class="select-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 15.4L6 9.4L7.4 8L12 12.6L16.6 8L18 9.4L12 15.4Z" fill="#1D1B20"/>
            </svg>
          </div>
        </div>

        <!-- Footer Buttons -->
        <footer class="form-footer">
          <button type="button" class="btn-outline">Cancel</button>
          <button type="submit" class="btn-solid">Save Changes</button>
        </footer>
      </form>
    </div>
  </main>
</body>
</html>
