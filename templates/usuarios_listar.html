<h2>Lista de Usuarios</h2>
<table border="1" cellpadding="5">
    <tr>
        <th>UserId</th>
        <th>Mail</th>
        <th>Role</th>
        <th>SessionStarted</th>
    </tr>
    {% for u in usuarios %}
    <tr>
        <td>{{ u.UserId }}</td>
        <td>{{ u.Mail }}</td>
        <td>{{ u.Role }}</td>
        <td>{{ "Sí" if u.SessionStarted else "No" }}</td>
    </tr>
    {% endfor %}
</table>
<br>
<a href='/usuarios/nuevo'>➕ Crear otro usuario</a>
