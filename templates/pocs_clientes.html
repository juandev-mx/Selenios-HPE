<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My POCs - HPE</title>
  <link rel="stylesheet" href="/static/css/home_cliente.css">
  <link rel="stylesheet" href="/static/css/pocs_clientes.css">
  <link rel="stylesheet" href="/static/css/sistema_modal.css">
</head>

<body>
  <header class="header">
    <div class="header-left">
      <a href="home_cliente.html">
        <img class="logo"
          src="https://api.builder.io/api/v1/image/assets/TEMP/8f928b3a2de14b9d3a5110b2e76de58b31f5c89d?width=188"
          alt="HPE Logo">
      </a>
      <h2 class="customer-text">Customer</h2>
    </div>

    <nav class="header-nav">
      <a href="/home_cliente.html" class="nav-link">Dashboard</a>
      <a href="/pocs_clientes.html" class="nav-link active">My POCs</a>
      <a href="/solutions_catalog.html" class="nav-link">Solutions Catalog</a>
      <img class="avatar" src="static/img/user.png" alt="User Avatar">
    </nav>
  </header>

  <main class="main-container">
    <div class="page-title">
      <h1>My POCs</h1>
      <p>View and manage your Proof of Concepts</p>
    </div>

    <div class="filters-section">
      <div class="filter-group">
        <label for="status-filter">Status:</label>
        <select id="status-filter" onchange="filterPOCs()">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
        </select>
      </div>

      <button id="create-poc-btn" class="btn btn-primary" onclick="window.openCreatePOC()">
        Create New POC
      </button>
    </div>

    <div id="pocs-container" class="pocs-grid">
      <div class="loading">Loading your POCs...</div>
    </div>

    <div id="no-pocs-message" style="display: none; text-align: center; padding: 3rem;">
      <h3>No POCs found</h3>
      <p>You haven't created any POCs yet.</p>

    </div>
  </main>

  <script src="/static/js/create_pocs.js"></script>
  <script src="/static/js/pocs_clientes.js"></script>
</body>

</html>
