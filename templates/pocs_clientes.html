<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My POCs - HPE</title>
  <link rel="stylesheet" href="/static/css/home_cliente.css">
  <link rel="stylesheet" href="/static/css/pocs_clientes.css">
  <link rel="stylesheet" href="/static/css/sistema_modal.css">
  <link rel="stylesheet" href="/static/css/navbar_cliente.css">
</head>

<body>
  <div id="navbar-placeholder"></div>

  <main class="main-container">
    <div class="page-title">
      <h1>My POCs</h1>
      <p>View and manage your Proof of Concepts</p>
    </div>

    <div class="filters-section">
      <div class="filter-group">
        <label for="status-filter">Status:</label>
        <select id="status-filter" onchange="filterPOCs()">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
        </select>
      </div>

        <!-- NUEVOS BOTONES DE VISTA -->
  <div class="view-toggle">
    <button id="grid-view-btn" class="view-btn active" onclick="changeView('grid')" title="Grid View">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
      </svg>
    </button>
    <button id="list-view-btn" class="view-btn" onclick="changeView('list')" title="List View">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 4h18v2H3V4zm0 7h18v2H3v-2zm0 7h18v2H3v-2z"/>
      </svg>
    </button>
  </div>
  
      <button id="create-poc-btn" class="btn btn-primary" onclick="window.openCreatePOC()">
        Create New POC
      </button>
    </div>

    <div id="pocs-container" class="pocs-grid">
      <div class="loading">Loading your POCs...</div>
    </div>

    <div id="no-pocs-message" style="display: none; text-align: center; padding: 3rem;">
      <h3>No POCs found</h3>
      <p>You haven't created any POCs yet.</p>

    </div>
  </main>

  <script>
    // Obtener el rol que guardaste al hacer login
    // (puede venir de localStorage, sessionStorage o tu lógica actual)
    const userRole = localStorage.getItem("role"); 

    if (userRole === "CLIENT") {
        fetch("/components/navbar_cliente.html")
            .then(response => response.text())
            .then(html => {
                // Coloca el HTML dentro del placeholder
                document.getElementById("navbar-placeholder").innerHTML = html;

                // (Opcional pero recomendado) Marcar la opción activa
                const links = document.querySelectorAll(".nav-link");
                links.forEach(link => {
                    if (link.href === window.location.href) {
                        link.classList.add("active");
                    }
                });
            })
            .catch(err => console.error("Error cargando navbar:", err));
    }
</script>

  <script src="/static/js/notifications.js"></script>
  <script src="/static/js/navbar_client.js"></script>
  <script src="/static/js/create_pocs.js"></script>
  <script src="/static/js/pocs_clientes.js"></script>
</body>

</html>
